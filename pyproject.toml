[project]
name = "course-langgraph-masterclass"
version = "0.1.0"
description = ""
authors = [
    {name = "Ramya Devi Gummella",email = "ramyadevi.gummella@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "langchain (>=1.4.9,<2.0.0)",
    "langgraph (>=1.2.20,<2.0.0)",
    "anthropic (>=2.8.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
